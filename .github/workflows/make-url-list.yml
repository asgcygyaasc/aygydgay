name: Generate article URL list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate exact 900 GitHub blob URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents?ref=main&per_page=100" \
            --jq '.[] | select(.type == "file" and (.name | endswith(".md")) and .name != "README.md") | .path' \
            > article-paths.txt

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re

          paths = [x.strip() for x in Path('article-paths.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          numbered = {}
          for p in paths:
              m = re.search(r'第(\d+)篇\.md$', p)
              if m:
                  n = int(m.group(1))
                  numbered.setdefault(n, []).append(p)

          missing = [n for n in range(1, 901) if n not in numbered]
          if missing:
              raise SystemExit(f'missing article numbers: {missing[:50]}')

          selected = [sorted(numbered[n])[0] for n in range(1, 901)]
          urls = ['https://github.com/asgcygyaasc/aygydgay/blob/main/' + quote(p, safe='/') for p in selected]
          Path('aygydgay-900-urls.txt').write_text('\n'.join(urls) + '\n', encoding='utf-8')
          print(f'All Markdown files: {len(paths)}; selected unique article numbers: {len(urls)}')
          PY
      - name: Upload TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: aygydgay-900-urls
          path: aygydgay-900-urls.txt
          if-no-files-found: error
      - name: Commit URL list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aygydgay-900-urls.txt
          git diff --cached --quiet || git commit -m 'Generate 900 article URLs'
          git push
