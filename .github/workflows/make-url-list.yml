name: Generate article URL list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate exact GitHub blob URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents?ref=main&per_page=100" \
            --jq '.[] | select(.type == "file" and (.name | endswith(".md")) and .name != "README.md") | .path' \
            > article-paths.txt

          count=$(wc -l < article-paths.txt)
          echo "Found $count article Markdown files"
          test "$count" -eq 900

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          paths = [x.strip() for x in Path('article-paths.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          urls = ['https://github.com/asgcygyaasc/aygydgay/blob/main/' + quote(p, safe='/') for p in sorted(paths)]
          Path('aygydgay-900-urls.txt').write_text('\n'.join(urls) + '\n', encoding='utf-8')
          print(f'Generated {len(urls)} URLs')
          PY
      - name: Commit URL list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aygydgay-900-urls.txt
          git diff --cached --quiet || git commit -m 'Generate 900 article URLs'
          git push
