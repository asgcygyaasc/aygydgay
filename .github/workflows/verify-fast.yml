name: Verify 900 GitHub URLs Fast
on:
  push:
    paths:
      - '.github/workflows/verify-fast.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check 900 URLs concurrently
        shell: bash
        run: |
          set -e
          git config core.quotePath false
          git ls-tree -r --name-only HEAD > files.txt
          python3 - <<'PY'
          import re, urllib.parse
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          files=[x for x in Path('files.txt').read_text(encoding='utf-8').splitlines() if x.endswith('.md') and x!='README.md']
          chosen={}
          for f in files:
              m=re.search(r'第(\d+)篇\.md$', f)
              if m and 1<=int(m.group(1))<=900:
                  n=int(m.group(1)); chosen[n]=min(chosen.get(n,f),f)
          assert len(chosen)==900, f'only {len(chosen)} numbered files'
          urls=['https://github.com/asgcygyaasc/aygydgay/blob/main/'+urllib.parse.quote(chosen[n],safe='/') for n in range(1,901)]
          def check(u):
              try:
                  req=Request(u,headers={'User-Agent':'Mozilla/5.0'})
                  with urlopen(req,timeout=10) as r: return r.status,u
              except Exception as e: return 'ERR:'+type(e).__name__,u
          with ThreadPoolExecutor(max_workers=40) as ex:
              results=list(ex.map(check,urls))
          bad=[x for x in results if x[0]!=200]
          print(f'TOTAL={len(results)} OK={len(results)-len(bad)} BAD={len(bad)}')
          for x in bad: print(x[0],x[1])
          if bad: raise SystemExit(1)
          PY
